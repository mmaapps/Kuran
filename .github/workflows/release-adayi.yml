name: Kararlı APK adayı
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-adayi.yml'
permissions:
  contents: read
jobs:
  aday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testler ve release AAB
        run: gradle :app:testDebugUnitTest :app:bundleRelease --stacktrace
      - name: Release evrensel APK adayı (geçici imza)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ephemeral.p12" -storetype PKCS12 -storepass candidate-only -keypass candidate-only -alias candidate -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Temporary Candidate"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=app/build/outputs/bundle/release/app-release.aab --output="$RUNNER_TEMP/release.apks" --mode=universal --ks="$RUNNER_TEMP/ephemeral.p12" --ks-pass=pass:candidate-only --ks-key-alias=candidate --key-pass=pass:candidate-only
          mkdir -p candidate
          unzip -p "$RUNNER_TEMP/release.apks" universal.apk > candidate/KuranKerim-release-aday.apk
          test -s candidate/KuranKerim-release-aday.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose candidate/KuranKerim-release-aday.apk
          "$BT/aapt" dump badging candidate/KuranKerim-release-aday.apk > candidate/badging.txt
          CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts)"
          NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          [[ "$CODE" =~ ^[1-9][0-9]*$ && "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "package: name='com.atasoyyazilim.kurankerim' versionCode='$CODE' versionName='$NAME'" candidate/badging.txt
          ! grep -q '^application-debuggable' candidate/badging.txt
          printf '%s\n' "$GITHUB_SHA" > candidate/commit.txt
          (cd candidate && sha256sum KuranKerim-release-aday.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/ephemeral.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: KuranKerim-release-aday
          path: candidate/
          if-no-files-found: error
