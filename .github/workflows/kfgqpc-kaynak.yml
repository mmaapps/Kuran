name: KFGQPC HAFS kaynak kontrolü
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kfgqpc-kaynak.yml'
permissions:
  contents: read
jobs:
  kaynak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resmî Mushaf Publisher 3.16 paketini doğrula ve incele
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/kfgqpc"
          mkdir -p "$p"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 300 \
            'https://qurancomplex.gov.sa/files/downloads/Mushaf-Publisher-3.16.zip' -o "$p/Mushaf-Publisher-3.16.zip"
          printf '%s  %s\n' '16e7dc5e91c6118f9fceb87244862afac2a616adc6472adac84e2836ac39e28a' "$p/Mushaf-Publisher-3.16.zip" | sha256sum --check
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "kfgqpc" / "Mushaf-Publisher-3.16.zip"
          with zipfile.ZipFile(p) as z:
              for f in z.infolist():
                  print(repr(f.filename), f.file_size)
              print("Font/lisans adayları:")
              for f in z.infolist():
                  if f.filename.lower().endswith((".ttf", ".otf", ".txt", ".pdf", ".msi", ".exe")):
                      print(repr(f.filename), f.file_size)
          PY
          # Windows çalıştırılabilir dosyası çalıştırılmaz; font ve lisans doğrulanmadan aktarım yok.
      - name: MSI arşivini çalıştırmadan aç
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y msitools python3-fonttools
          p="$RUNNER_TEMP/kfgqpc"
          python3 - <<'PY'
          import os, zipfile, shutil
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "kfgqpc"
          with zipfile.ZipFile(p / "Mushaf-Publisher-3.16.zip") as z:
              with z.open("Mushaf-Publisher-3.16/SetupProject.msi") as src, (p / "SetupProject.msi").open("wb") as dst:
                  shutil.copyfileobj(src, dst)
          PY
          mkdir -p "$p/extracted"
          msiextract -C "$p/extracted" "$p/SetupProject.msi" > "$p/msi-files.txt"
          /usr/bin/python3 - <<'PY'
          import os, hashlib
          from pathlib import Path
          from fontTools.ttLib import TTFont
          p = Path(os.environ["RUNNER_TEMP"]) / "kfgqpc" / "extracted"
          fonts = sorted(f for f in p.rglob("*") if f.is_file() and f.suffix.lower() in (".ttf", ".otf"))
          print("Bulunan fontlar:", len(fonts))
          for f in fonts:
              print("DOSYA:", f.relative_to(p), "SHA256:", hashlib.sha256(f.read_bytes()).hexdigest())
              with TTFont(f) as font:
                  for i in (0, 1, 2, 4, 5, 6, 8, 13, 14):
                      n = font["name"].getDebugName(i)
                      if n:
                          print(i, repr(n[:1200]))
          print("Lisans adayları:")
          for f in sorted(p.rglob("*")):
              if f.is_file() and (f.suffix.lower() in (".txt", ".pdf", ".rtf") or any(s in f.name.lower() for s in ("license","licence","eula","copyright","readme"))):
                  print(repr(str(f.relative_to(p))), f.stat().st_size)
          assert fonts, "MSI içinden font çıkmadı"
          PY
          # İnceleme dışında yükleme, kurulum veya font dağıtımı yapılmaz.
      - name: Özgün HAFS fontunu ve tam lisansını doğrula
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os, hashlib, unicodedata, xml.etree.ElementTree as ET
          from pathlib import Path
          from fontTools.ttLib import TTFont
          f = Path(os.environ["RUNNER_TEMP"]) / "kfgqpc/extracted/Fonts Folder/uthmanic_hafs_v20.ttf"
          raw = f.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "abfdc24eba06d05c34879e2514791d6bb25471b8ae3a1d436efa88b4d4351126"
          with TTFont(f) as font:
              assert font["name"].getDebugName(1) == "KFGQPC_HAFS_Uthmanic_Script_H"
              license_text = font["name"].getDebugName(13)
              assert license_text and "END-USER LICENSE AGREEMENT" in license_text
              print("TAM LİSANS BAŞLANGICI")
              print(license_text)
              print("TAM LİSANS SONU")
              cmap = font.getBestCmap()
              root = ET.parse("app/src/main/assets/content/quran/quran-uthmani.xml").getroot()
              used = {ord(c) for a in root.findall("./sura/aya") for c in a.attrib.get("text", "") if not c.isspace() and unicodedata.category(c) != "Cf"}
              missing = sorted(used - set(cmap))
              print("Unicode karakter sayısı:", len(used))
              print("Eksik cmap karakterleri:", [(hex(c), unicodedata.name(chr(c), "?")) for c in missing])
              assert not missing, "Font tüm metin karakterlerini doğrudan kapsamadı; gözden geçirme gerekli"
          PY
      # Lisansın tam metni ve kapsam kontrolü incelenmeden font depoya veya artifact'e aktarılmaz.
