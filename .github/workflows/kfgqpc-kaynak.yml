name: KFGQPC HAFS kaynak kontrolü
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kfgqpc-kaynak.yml'
permissions:
  contents: read
jobs:
  kaynak:
    runs-on: ubuntu-latest
    steps:
      - name: Resmî Mushaf Publisher 3.16 paketini doğrula ve incele
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/kfgqpc"
          mkdir -p "$p"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 300 \
            'https://qurancomplex.gov.sa/files/downloads/Mushaf-Publisher-3.16.zip' -o "$p/Mushaf-Publisher-3.16.zip"
          printf '%s  %s\n' '16e7dc5e91c6118f9fceb87244862afac2a616adc6472adac84e2836ac39e28a' "$p/Mushaf-Publisher-3.16.zip" | sha256sum --check
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "kfgqpc" / "Mushaf-Publisher-3.16.zip"
          with zipfile.ZipFile(p) as z:
              for f in z.infolist():
                  print(repr(f.filename), f.file_size)
              print("Font/lisans adayları:")
              for f in z.infolist():
                  if f.filename.lower().endswith((".ttf", ".otf", ".txt", ".pdf", ".msi", ".exe")):
                      print(repr(f.filename), f.file_size)
          PY
          # Windows çalıştırılabilir dosyası çalıştırılmaz; font ve lisans doğrulanmadan aktarım yok.
