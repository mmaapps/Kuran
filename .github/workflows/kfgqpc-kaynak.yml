name: KFGQPC HAFS kaynak kontrolü
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kfgqpc-kaynak.yml'
permissions:
  contents: read
jobs:
  kaynak:
    runs-on: ubuntu-latest
    steps:
      - name: Eski resmî HAFS arşiv adresini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kfgqpc"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 \
            --write-out '%{url_effective}\n' \
            'https://fonts.qurancomplex.gov.sa/wp02/wp-content/uploads/2020/07/Hafs.zip' \
            -o "$RUNNER_TEMP/kfgqpc/Hafs.zip" > "$RUNNER_TEMP/kfgqpc/source.txt"
          python3 - <<'PY'
          import os, zipfile, hashlib
          from pathlib import Path
          from urllib.parse import urlparse
          p = Path(os.environ["RUNNER_TEMP"]) / "kfgqpc"
          host = urlparse((p / "source.txt").read_text().strip()).hostname
          assert host == "qurancomplex.gov.sa" or (host and host.endswith(".qurancomplex.gov.sa")), "Resmî alan adı dışına yönlendirme"
          archive = p / "Hafs.zip"
          assert zipfile.is_zipfile(archive), "Yanıt geçerli ZIP değil"
          print("Kaynak:", (p / "source.txt").read_text().strip())
          print("Arşiv SHA256:", hashlib.sha256(archive.read_bytes()).hexdigest())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for f in z.infolist():
                  print(repr(f.filename), f.file_size)
              assert any(f.filename.lower().endswith(".ttf") for f in z.infolist()), "TTF dosyası bulunamadı"
          PY
      - name: Resmî arşivi inceleme için sakla
        uses: actions/upload-artifact@v4
        with:
          name: KFGQPC-HAFS-kaynak-inceleme
          path: |
            ${{ runner.temp }}/kfgqpc/Hafs.zip
            ${{ runner.temp }}/kfgqpc/source.txt
          if-no-files-found: error
